name: Docker Node All Browsers (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag of the image (ex: 4.44.0 or 4.44.0-1)'
        required: true
        type: string
      selenium_version:
        description: 'Selenium base image version (selenium/node-all-browsers:<version>)'
        required: true
        default: '4.44.0'
        type: string
      extension_version:
        description: 'Cerberus Robot Extension version (jar on vm.cerberus-testing.org/delivery)'
        required: true
        default: '2.1-SNAPSHOT'
        type: string
      push_latest:
        description: 'Also tag as latest'
        required: true
        default: false
        type: boolean
      push_detailed_tag:
        description: 'Also push a detailed tag (<version>-c<chrome>-f<firefox>-e<edge>-ext<ext>)'
        required: true
        default: true
        type: boolean

env:
  IMAGE: cerberustesting/node-all-browsers

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build once locally (not pushed) to read the browser versions embedded in the image
      - name: Build image (local)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./docker/cerberusNodeAllBrowser
          load: true
          push: false
          tags: local/node-all-browsers:check
          build-args: |
            VERSION=${{ inputs.selenium_version }}
            CERBERUS_ROBOT_EXTENSION_VERSION=${{ inputs.extension_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Detect browser versions
        id: browsers
        run: |
          out=$(docker run --rm --entrypoint bash local/node-all-browsers:check -c \
            'google-chrome --version; firefox --version; microsoft-edge --version' 2>/dev/null)
          echo "$out"
          chrome=$(echo "$out"  | grep -i 'chrome'  | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          firefox=$(echo "$out" | grep -i 'firefox' | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          edge=$(echo "$out"    | grep -i 'edge'    | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          echo "chrome=$chrome"   >> "$GITHUB_OUTPUT"
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          echo "edge=$edge"       >> "$GITHUB_OUTPUT"
          echo "chrome_major=${chrome%%.*}"   >> "$GITHUB_OUTPUT"
          echo "firefox_major=${firefox%%.*}" >> "$GITHUB_OUTPUT"
          echo "edge_major=${edge%%.*}"       >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          tags="${IMAGE}:${{ inputs.version }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            tags="$tags,${IMAGE}:latest"
          fi
          if [ "${{ inputs.push_detailed_tag }}" = "true" ]; then
            tags="$tags,${IMAGE}:${{ inputs.version }}-c${{ steps.browsers.outputs.chrome_major }}-f${{ steps.browsers.outputs.firefox_major }}-e${{ steps.browsers.outputs.edge_major }}-ext${{ inputs.extension_version }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./docker/cerberusNodeAllBrowser
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.selenium_version }}
            CERBERUS_ROBOT_EXTENSION_VERSION=${{ inputs.extension_version }}
          labels: |
            org.opencontainers.image.title=Cerberus Node All Browsers
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.cerberus-testing.selenium=${{ inputs.selenium_version }}
            org.cerberus-testing.chrome=${{ steps.browsers.outputs.chrome }}
            org.cerberus-testing.firefox=${{ steps.browsers.outputs.firefox }}
            org.cerberus-testing.edge=${{ steps.browsers.outputs.edge }}
            org.cerberus-testing.robot-extension=${{ inputs.extension_version }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "## ${IMAGE}:${{ inputs.version }}"
            echo ""
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Selenium | ${{ inputs.selenium_version }} |"
            echo "| Chrome | ${{ steps.browsers.outputs.chrome }} |"
            echo "| Firefox | ${{ steps.browsers.outputs.firefox }} |"
            echo "| Edge | ${{ steps.browsers.outputs.edge }} |"
            echo "| Robot Extension | ${{ inputs.extension_version }} |"
            echo ""
            echo "Tags pushed: \`${{ steps.tags.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
