name: Docker Node All Browsers (manual)

run-name: Docker Node All Browsers ${{ inputs.selenium_version }}-${{ inputs.extension_version }}${{ inputs.push_latest && ' (+latest)' || '' }}

on:
  workflow_dispatch:
    inputs:
      selenium_version:
        description: 'Selenium base image version (selenium/node-all-browsers:<version>)'
        required: true
        default: '4.51.0'
        type: string
      extension_version:
        description: 'Cerberus Robot Extension version (jar on vm.cerberus-testing.org/delivery)'
        required: true
        default: '2.1-SNAPSHOT'
        type: string
      extension_classifier:
        description: 'Jar classifier appended to the extension version (ex: linux). Leave empty for none'
        required: false
        default: 'linux'
        type: string
      push_latest:
        description: 'Also tag as latest'
        required: true
        default: false
        type: boolean

env:
  IMAGE: cerberustesting/node-all-browsers
  # Full jar version (with classifier), used to download the jar. The image tag only uses extension_version.
  EXTENSION_JAR_VERSION: ${{ inputs.extension_classifier && format('{0}-{1}', inputs.extension_version, inputs.extension_classifier) || inputs.extension_version }}

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build once locally (not pushed) to read the browser versions embedded in the image
      - name: Build image (local)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./docker/cerberusNodeAllBrowser
          load: true
          push: false
          tags: local/node-all-browsers:check
          build-args: |
            VERSION=${{ inputs.selenium_version }}
            CERBERUS_ROBOT_EXTENSION_VERSION=${{ env.EXTENSION_JAR_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Detect browser versions
        id: browsers
        run: |
          out=$(docker run --rm --entrypoint bash local/node-all-browsers:check -c \
            'google-chrome --version; firefox --version; microsoft-edge --version' 2>/dev/null)
          echo "$out"
          chrome=$(echo "$out"  | grep -i 'chrome'  | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          firefox=$(echo "$out" | grep -i 'firefox' | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          edge=$(echo "$out"    | grep -i 'edge'    | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          echo "chrome=$chrome"   >> "$GITHUB_OUTPUT"
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          echo "edge=$edge"       >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          version="${{ inputs.selenium_version }}-${{ inputs.extension_version }}"
          tags="${IMAGE}:${version}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            tags="$tags,${IMAGE}:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./docker/cerberusNodeAllBrowser
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.selenium_version }}
            CERBERUS_ROBOT_EXTENSION_VERSION=${{ env.EXTENSION_JAR_VERSION }}
          labels: |
            org.opencontainers.image.title=Cerberus Node All Browsers
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.cerberus-testing.selenium=${{ inputs.selenium_version }}
            org.cerberus-testing.chrome=${{ steps.browsers.outputs.chrome }}
            org.cerberus-testing.firefox=${{ steps.browsers.outputs.firefox }}
            org.cerberus-testing.edge=${{ steps.browsers.outputs.edge }}
            org.cerberus-testing.robot-extension=${{ env.EXTENSION_JAR_VERSION }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "## ${IMAGE}:${{ steps.tags.outputs.version }}"
            echo ""
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Selenium | ${{ inputs.selenium_version }} |"
            echo "| Chrome | ${{ steps.browsers.outputs.chrome }} |"
            echo "| Firefox | ${{ steps.browsers.outputs.firefox }} |"
            echo "| Edge | ${{ steps.browsers.outputs.edge }} |"
            echo "| Robot Extension | ${{ env.EXTENSION_JAR_VERSION }} |"
            echo ""
            echo "Tags pushed: \`${{ steps.tags.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
